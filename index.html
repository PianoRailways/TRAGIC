<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="tragic.png">
    <link rel="apple-touch-icon" href="tragic.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>TRAGIC (NOWE)</title>
</head>
<body>
  <header class="topbar">
    <h1 id="stationTitle">Station wählen</h1>
    <div id="search-box">
      <input type="text" id="query" placeholder="Station suchen…" autocomplete="off" inputmode="search">
      <ul id="suggestions"></ul>
    </div>
    <div class="time-picker-box">
      <input type="datetime-local" id="timePicker">
    </div>
</header>

<table id="departureTable" style="display:none">
  <thead>
    <tr>
      <th class="col-line">Linie</th>
      <th class="col-nr">Fahrtnummer</th>
      <th class="col-dest">Ziel</th>
      <th class="col-time">Ab</th>
      <th class="col-delay">Verspätung</th>
    </tr>
  </thead>
  <tbody id="departureBody"></tbody>
</table>

<div id="status"></div>
<script src="script.js"></script>
</body>
</html>
