<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>NOWE Weltweit – Abfahrten</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; background:#111; color:#eee; margin:0; padding:1rem; }
  h1 { font-size:1.2rem; margin-bottom:0.5rem; }
  #search-box { margin-bottom:1rem; }
  input { padding:0.5rem; font-size:1rem; width:280px; }
  #suggestions { list-style:none; margin:0; padding:0; max-width:400px; position:relative; z-index:5; }
  #suggestions li { padding:0.4rem; cursor:pointer; background:#222; border-bottom:1px solid #333; }
  #suggestions li:hover { background:#333; }
  table { width:100%; border-collapse:collapse; margin-top:1rem; }
  th, td { text-align:left; padding:0.5rem 0.8rem; border-bottom:1px solid #333; font-size:1.05rem; }
  th { color:#888; font-weight:normal; font-size:0.85rem; }
  .line { font-weight:bold; background:#0a5; padding:0.2rem 0.5rem; border-radius:4px; display:inline-block; min-width:2.2rem; text-align:center; }
  .tripnr { color:#999; font-size:0.85rem; }
  .delay { color:#f55; font-weight:bold; }
  .ontime { color:#5f5; }
  .cancelled { color:#f55; text-decoration:line-through; }
  #status { color:#888; font-size:0.9rem; margin-top:0.5rem; }
  tr.dep-row { cursor:pointer; }
  tr.dep-row:hover { background:#1a1a1a; }
  tr.chain-row td { background:#0a0a0a; padding:0; }
  .chain-wrap { padding:0.6rem 1rem 1rem 2rem; }
  .chain-wrap table { margin-top:0.3rem; }
  .chain-wrap th, .chain-wrap td { font-size:0.95rem; padding:0.3rem 0.6rem; }
  .stop-link { cursor:pointer; text-decoration:underline dotted; }
  .stop-link:hover { color:#5cf; }
  .chain-header { color:#aaa; font-size:0.9rem; margin-bottom:0.2rem; }
</style>
</head>
<body>

<h1 id="stationTitle">Station wählen</h1>

<div id="search-box">
  <input type="text" id="query" placeholder="Station suchen…" autocomplete="off">
  <ul id="suggestions"></ul>
</div>

<table id="departureTable" style="display:none">
  <thead>
    <tr><th>Linie</th><th>Nr.</th><th>Ziel</th><th>Abfahrt</th><th>Verspätung</th><th>Gleis</th></tr>
  </thead>
  <tbody id="departureBody"></tbody>
</table>

<div id="status"></div>

<script>
const PROXY = 'proxy.php';
let currentStopId = null;
let refreshTimer = null;
let openChainRow = null; // welche Abfahrt ist aktuell aufgeklappt

const params = new URLSearchParams(location.search);
if (params.get('stopId')) {
  currentStopId = params.get('stopId');
  loadDepartures();
}

document.getElementById('query').addEventListener('input', debounce(async (e) => {
  const q = e.target.value.trim();
  const list = document.getElementById('suggestions');
  list.innerHTML = '';
  if (q.length < 2) return;

  try {
    const res = await fetch(`${PROXY}?action=search&query=${encodeURIComponent(q)}`);
    const data = await res.json();
    (data.stations || []).forEach(st => {
      if (!st.id) return;
      const li = document.createElement('li');
      li.textContent = st.name;
      li.onclick = () => selectStation(st.id, st.name);
      list.appendChild(li);
    });
  } catch (err) {
    setStatus('Fehler bei der Stationssuche: ' + err.message);
  }
}, 350));

// stationId + optional Referenzzeit (Epoch Sekunden), z.B. Ankunft der vorherigen Fahrt
function selectStation(stopId, name, refEpoch) {
  currentStopId = stopId;
  openChainRow = null;
  document.getElementById('stationTitle').textContent = name;
  document.getElementById('suggestions').innerHTML = '';
  document.getElementById('query').value = name;

  const url = new URL(location.href);
  url.searchParams.set('stopId', stopId);
  if (refEpoch) url.searchParams.set('time', refEpoch); else url.searchParams.delete('time');
  history.pushState({}, '', url);

  loadDepartures(refEpoch);
}

async function loadDepartures(refEpoch) {
  if (!currentStopId) return;
  setStatus('Lade Abfahrten…');

  try {
    let q = `${PROXY}?action=departures&stopId=${encodeURIComponent(currentStopId)}&n=12`;
    if (refEpoch) {
      const iso = new Date(refEpoch * 1000).toISOString();
      q += `&time=${encodeURIComponent(iso)}`;
    }
    const res = await fetch(q);
    const data = await res.json();

    if (data.error) {
      setStatus('Fehler: ' + data.error);
      return;
    }

    renderDepartures(data.departures || []);
    setStatus(refEpoch
      ? 'Abfahrten ab Ankunft der vorherigen Fahrt · aktualisiert ' + new Date().toLocaleTimeString('de-CH')
      : 'Aktualisiert: ' + new Date().toLocaleTimeString('de-CH'));
  } catch (err) {
    setStatus('Fehler beim Laden: ' + err.message);
  }

  clearTimeout(refreshTimer);
  // Nur automatisch neu laden, wenn wir im "Live"-Modus sind (keine feste Referenzzeit)
  if (!refEpoch) refreshTimer = setTimeout(() => loadDepartures(), 30000);
}

function renderDepartures(departures) {
  const tbody = document.getElementById('departureBody');
  tbody.innerHTML = '';
  document.getElementById('departureTable').style.display = departures.length ? 'table' : 'none';

  departures.forEach((dep, idx) => {
    const tr = document.createElement('tr');
    tr.className = 'dep-row';

    const time = dep.live ? new Date(dep.live * 1000) : null;
    const timeStr = time ? time.toLocaleTimeString('de-CH', {hour:'2-digit', minute:'2-digit'}) : '–';

    let delayCell = '<span class="ontime">pünktlich</span>';
    if (dep.cancelled) {
      delayCell = '<span class="cancelled">ausgefallen</span>';
    } else if (dep.delayMin !== null && dep.delayMin > 0) {
      delayCell = `<span class="delay">+${dep.delayMin} min</span>`;
    }

    tr.innerHTML = `
      <td><span class="line">${escapeHtml(dep.line)}</span></td>
      <td class="tripnr">${dep.tripNumber ? escapeHtml(dep.tripNumber) : '–'}</td>
      <td>${escapeHtml(dep.destination)}</td>
      <td>${timeStr}</td>
      <td>${delayCell}</td>
      <td>${dep.track ? escapeHtml(dep.track) : '–'}</td>
    `;
    tr.onclick = () => toggleChain(tr, dep);
    tbody.appendChild(tr);
  });
}

async function toggleChain(tr, dep) {
  // Bereits aufgeklappte Chain schliessen, wenn dieselbe Zeile erneut angeklickt wird
  const existing = tr.nextElementSibling;
  if (existing && existing.classList.contains('chain-row')) {
    existing.remove();
    return;
  }
  // Andere offene Chain schliessen
  document.querySelectorAll('.chain-row').forEach(r => r.remove());

  if (!dep.tripId) {
    alert('Keine Fahrtnummer (tripId) für diese Verbindung vorhanden – Fahrtverlauf nicht möglich.');
    return;
  }

  const chainTr = document.createElement('tr');
  chainTr.className = 'chain-row';
  const td = document.createElement('td');
  td.colSpan = 6;
  td.innerHTML = '<div class="chain-wrap">Lade Fahrtverlauf…</div>';
  chainTr.appendChild(td);
  tr.after(chainTr);

  try {
    const res = await fetch(`${PROXY}?action=trip&tripId=${encodeURIComponent(dep.tripId)}`);
    const data = await res.json();

    if (data.error) {
      td.innerHTML = `<div class="chain-wrap">Fehler: ${escapeHtml(data.error)}</div>`;
      return;
    }

    td.innerHTML = renderChain(data);
  } catch (err) {
    td.innerHTML = `<div class="chain-wrap">Fehler beim Laden des Fahrtverlaufs: ${escapeHtml(err.message)}</div>`;
  }
}

function renderChain(data) {
  const rows = (data.stops || []).map(stop => {
    const arr = fmtTime(stop.arrivalLive);
    const dep = fmtTime(stop.departureLive);
    const delaySec = stop.departureDelaySec ?? stop.arrivalDelaySec;
    const delayStr = stop.cancelled
      ? '<span class="cancelled">ausgefallen</span>'
      : (delaySec ? `<span class="delay">${fmtDelay(delaySec)}</span>` : '<span class="ontime">pünktlich</span>');

    const refEpoch = stop.arrivalLive || stop.arrivalSched;
    const clickable = stop.stopId
      ? `onclick="selectStation('${escapeAttr(stop.stopId)}', '${escapeAttr(stop.name)}', ${refEpoch || 'null'})"`
      : '';

    return `
      <tr>
        <td class="${stop.stopId ? 'stop-link' : ''}" ${clickable}>${escapeHtml(stop.name)}</td>
        <td>${arr}</td>
        <td>${dep}</td>
        <td>${delayStr}</td>
        <td>${stop.track ? escapeHtml(stop.track) : '–'}</td>
      </tr>`;
  }).join('');

  return `
    <div class="chain-header">
      Fahrtverlauf – Linie <b>${escapeHtml(data.line || '?')}</b>
      ${data.tripNumber ? '· Nr. ' + escapeHtml(data.tripNumber) : ''}
      ${data.destination ? '→ ' + escapeHtml(data.destination) : ''}
      <br><small>Klick auf eine Station lädt deren Abfahrtstafel, ab der Ankunftszeit dieser Fahrt dort.</small>
    </div>
    <table>
      <thead><tr><th>Station</th><th>an</th><th>ab</th><th>Verspätung</th><th>Gleis</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function fmtTime(epoch) {
  if (!epoch) return '–';
  return new Date(epoch * 1000).toLocaleTimeString('de-CH', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}

// Sekundengenaue Verspätung als +mm:ss darstellen
function fmtDelay(sec) {
  const sign = sec < 0 ? '-' : '+';
  const abs = Math.abs(sec);
  const m = Math.floor(abs / 60);
  const s = abs % 60;
  return `${sign}${m}:${String(s).padStart(2,'0')}`;
}

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escapeAttr(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/[\\'"]/g, c => '\\' + c);
}

function debounce(fn, delay) {
  let t;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), delay);
  };
}
</script>

</body>
</html>
