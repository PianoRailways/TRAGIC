<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="stylesheet" href="line-container.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="tragic.png">
    <link rel="apple-touch-icon" href="tragic.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>OMNI (NOWE)</title>
</head>
<body>
  <!-- ═══════════════ HEADER ═══════════════ -->
  <header id="app-header">
    <div id="header-left">
      <button id="btn-home" onClick="window.location = './?stopId=ch-opentransportdataswiss26_Parentch%3A1%3Asloid%3A82597'" title="Startseite">⌂ Home</button>
    </div>
    <div id="header-center"><span id="live-clock" onClick="window.location = './'">18:04:69</span></div>
    <div id="header-right">
      <span id="app-title" style="text-decoration: none;" onclick="toggleArrivalMode()">öV OMNI</span>
    </div>
  </header>

  <div class="panel">
    <!-- ═══════════════ FAVORITEN ═══════════════ -->
    <nav id="fav-bar">
      <button class="fav-btn" onClick="window.location = './?stopId=ch-opentransportdataswiss26_Parentch%3A1%3Asloid%3A8100'">LTH</button>
      <button class="fav-btn" onClick="window.location = './?stopId=ch-opentransportdataswiss26_Parentch%3A1%3Asloid%3A5000'">LZ</button>
      <button class="fav-btn" onClick="window.location = './?stopId=de-DELFI_ch%3A23005%3A6'">BAD</button>
      <button class="fav-btn" onClick="window.location = './?stopId=fr-agregat-des-reseaux-urbains-et-interurbains-en-region-grand-est_SNCF%3AOCETrainTER87182063'">MUL</button>
      <button class="fav-btn" onClick="window.location = './?stopId=ch-opentransportdataswiss26_Parent8721202'">STRS</button>
      <button class="fav-btn" onClick="window.location = './?stopId=ch-opentransportdataswiss26_Parentch%3A1%3Asloid%3A10'">BS</button>
    </nav>

    <!-- ═══════════════ TOPBAR ═══════════════ -->
    <div class="topbar">
      <div id="stationTitle" class="station-title">Station wählen</div>
      <div id="search-box">
        <input type="text" id="query" placeholder="Station suchen…" autocomplete="off" inputmode="search">
        <ul id="suggestions"></ul>
      </div>
      <div class="time-picker-row">
        <input type="date" id="datePicker">
        <input type="time" id="timePicker">
        <button id="btn-jetzt" title="Auf aktuelle Zeit setzen">JETZT</button>
        <button id="btn-refresh" title="Aktualisieren">GO</button>
      </div>
    </div>

    <!-- ═══════════════ VERKEHRSMITTEL-FILTER ═══════════════ -->
    <nav id="mode-filter-bar">
      <span class="mode-filter-label">Filter:</span>
      <button id="btn-mode-all" class="mode-btn mode-all active" title="Alle Filter">Alle</button>
      <button class="mode-btn active" data-mode="HIGHSPEED" title="Hochgeschwindigkeit">Highspeed</button>
      <button class="mode-btn active" data-mode="RAIL" title="Bahn">🚆 Bahn</button>
      <button class="mode-btn active" data-mode="NIGHT" title="Nacht">Nacht</button>
      <button class="mode-btn active" data-mode="SUBWAY" title="U-Bahn">🚇 U</button>
      <button class="mode-btn active" data-mode="TRAM" title="Tram">🚊 Tram</button>
      <button class="mode-btn active" data-mode="BUS" title="Bus">🚌 Bus</button>
      <button class="mode-btn active" data-mode="FERRY" title="Schiff">⛴ Schiff</button>
      <button class="mode-btn active" data-mode="GONDOLA" title="Seilbahn">🚡 Seilbahn</button>
      <button class="mode-btn active" data-mode="OTHER" title="Andere">🚐 Andere</button>
    </nav>

    <!-- ═══════════════ ZIEL-FILTER ═══════════════ -->
    <div id="dest-filter-row">
      <input type="text" id="destFilter" placeholder="Filtern (z.B. Basel, IR26, 475)..." autocomplete="off">
    </div>
    <hr>
    <div id="status"></div>

    <!-- Navigation Buttons (oben) -->
    <div id="nav-buttons-top" class="nav-buttons" style="display:none">
      <button id="btn-earlier-top" class="nav-btn nav-btn-earlier">← Früher</button>
      <button id="btn-later-top" class="nav-btn nav-btn-later">Später →</button>
    </div>

    <!-- Calendar Export Button -->
    <button id="btn-export-calendar" class="btn-export-calendar" style="display: none;">
      📅 Zu Kalender exportieren
    </button>

    <table id="departureTable" style="display:none">
      <thead>
        <tr>
          <th id="th-col-time" class="col-time">Ab</th>
          <th class="col-line">Linie</th>
          <th id="th-col-dest" class="col-dest">Ziel</th>
          <th class="col-platform">Gl./Kt.</th>
        </tr>
      </thead>
      <tbody id="departureBody"></tbody>
    </table>

    <!-- Navigation Buttons (unten) -->
    <div id="nav-buttons-bottom" class="nav-buttons" style="display:none">
      <button id="btn-earlier-bottom" class="nav-btn nav-btn-earlier">← Früher</button>
      <button id="btn-later-bottom" class="nav-btn nav-btn-later">Später →</button>
    </div>

    <script src="script.js"></script>
  </div>

  <footer class="page-footer">
    <div class="source">Infos zur verwendeten Datenquelle: <a href="https://transitous.org/sources/" style="color: var(--sob-green); font-weight: bold;">Transitous</a></div>
    <div>Die Routing-Funktion befindet sich in der Beta und ist erreichbar unter: <a href="/routing" style="color: var(--sbb-red); font-weight: bold;">/routing</a></div>
    <div>Der Sourcecode ist auf <a href="https://github.com/PianoRailways/TRAGIC" style="color: var(--sob-green); font-weight: bold;">GitHub</a>.</div>
  </footer>
</body>
</html>
