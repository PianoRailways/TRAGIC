<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOWE Weltweit – Abfahrten</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #111;
    color: #eee;
    margin: 0;
    padding: 0.8rem;
  }

  h1 {
    font-size: clamp(1rem, 4vw, 1.3rem);
    margin: 0 0 0.6rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  header.topbar {
    position: sticky;
    top: 0;
    background: #111;
    padding-top: env(safe-area-inset-top, 0);
    z-index: 10;
    margin: -0.8rem -0.8rem 0.8rem;
    padding: 0.8rem 0.8rem 0.6rem;
  }

  #search-box { position: relative; }

  input {
    width: 100%;
    padding: 0.55rem 0.7rem;
    font-size: 1rem; /* verhindert Auto-Zoom auf iOS */
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 6px;
    color: #eee;
  }
  input:focus { outline: none; border-color: #0a5; }

  #suggestions {
    list-style: none;
    margin: 0.2rem 0 0;
    padding: 0;
    position: absolute;
    left: 0; right: 0;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 6px;
    z-index: 20;
    max-height: 55vh;
    overflow-y: auto;
  }
  #suggestions li {
    padding: 0.6rem 0.7rem;
    cursor: pointer;
    border-bottom: 1px solid #2a2a2a;
    font-size: 0.95rem;
  }
  #suggestions li:last-child { border-bottom: none; }
  #suggestions li:active, #suggestions li:hover { background: #262626; }

  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th, td {
    text-align: left;
    padding: 0.5rem 0.4rem;
    border-bottom: 1px solid #2a2a2a;
    font-size: 0.95rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  th { color: #888; font-weight: normal; font-size: 0.75rem; }

  /* Spaltenbreiten so verteilt, dass es auf schmalen Screens nicht bricht */
  .col-line  { width: 18%; }
  .col-nr    { width: 16%; }
  .col-dest  { width: 34%; white-space: normal; }
  .col-time  { width: 16%; }
  .col-delay { width: 16%; }

  .line {
    font-weight: bold;
    background: #0a5;
    color: #041b12;
    padding: 0.15rem 0.4rem;
    border-radius: 4px;
    display: inline-block;
    font-size: 0.85rem;
  }
  .tripnr { color: #999; font-size: 0.8rem; }
  .delay { color: #f55; font-weight: bold; }
  .ontime { color: #5f5; }
  .cancelled { color: #f55; text-decoration: line-through; }

  #status { color: #888; font-size: 0.8rem; margin-top: 0.6rem; text-align: center; }

  tr.dep-row { cursor: pointer; min-height: 44px; }
  tr.dep-row:active, tr.dep-row:hover { background: #1a1a1a; }

  tr.chain-row td { background: #0a0a0a; padding: 0; }
  .chain-wrap { padding: 0.5rem 0.4rem 0.8rem; }

  .chain-header { color: #aaa; font-size: 0.78rem; line-height: 1.4; margin-bottom: 0.4rem; }
  .chain-header b { color: #eee; }

  .timeline { position: relative; padding-left: 0.9rem; }
  .timeline::before {
    content: '';
    position: absolute;
    left: 0.22rem; top: 0.5rem; bottom: 0.5rem;
    width: 2px; background: #2a2a2a;
  }
  .stop {
    position: relative;
    padding: 0.4rem 0 0.4rem 0.7rem;
    display: flex;
    justify-content: space-between;
    gap: 0.5rem;
    min-height: 38px;
    align-items: flex-start;
  }
  .stop-dot {
    position: absolute;
    left: -0.68rem; top: 0.85rem;
    width: 0.5rem; height: 0.5rem;
    border-radius: 50%;
    background: #0a5;
    box-shadow: 0 0 0 3px #0a0a0a;
  }
  .stop.cancelled-stop .stop-dot { background: #f55; }
  .stop-name {
    font-size: 0.92rem;
    text-decoration: underline dotted #666;
    text-underline-offset: 2px;
    cursor: pointer;
  }
  .stop-name.no-link { text-decoration: none; cursor: default; }
  .stop-name:active, .stop-name:hover { color: #5cf; }
  .stop-times { color: #888; font-size: 0.72rem; margin-top: 0.1rem; }
  .stop-right { text-align: right; white-space: nowrap; font-size: 0.8rem; }
  .stop-track { color: #888; font-size: 0.7rem; margin-top: 0.1rem; }

  .empty-hint, .error-hint {
    text-align: center; color: #888; padding: 2rem 1rem; font-size: 0.9rem;
  }
  .error-hint { color: #f55; }

  /* Auf sehr schmalen Screens Gleis-Info in der Hauptzeile weglassen, steht eh im Fahrtverlauf */
  @media (max-width: 360px) {
    th, td { font-size: 0.88rem; padding: 0.45rem 0.3rem; }
  }
</style>
</head>
<body>

<header class="topbar">
  <h1 id="stationTitle">Station wählen</h1>
  <div id="search-box">
    <input type="text" id="query" placeholder="Station suchen…" autocomplete="off" inputmode="search">
    <ul id="suggestions"></ul>
  </div>
</header>

<table id="departureTable" style="display:none">
  <thead>
    <tr>
      <th class="col-line">Linie</th>
      <th class="col-nr">Nr.</th>
      <th class="col-dest">Ziel</th>
      <th class="col-time">Ab</th>
      <th class="col-delay">Verspätung</th>
    </tr>
  </thead>
  <tbody id="departureBody"></tbody>
</table>

<div id="status"></div>

<script>
const PROXY = 'proxy.php';
let currentStopId = null;
let refreshTimer = null;

const params = new URLSearchParams(location.search);
if (params.get('stopId')) {
  currentStopId = params.get('stopId');
  loadDepartures(params.get('time') ? Number(params.get('time')) : null);
}

document.getElementById('query').addEventListener('input', debounce(async (e) => {
  const q = e.target.value.trim();
  const list = document.getElementById('suggestions');
  list.innerHTML = '';
  if (q.length < 2) return;

  try {
    const res = await fetch(`${PROXY}?action=search&query=${encodeURIComponent(q)}`);
    const data = await res.json();
    (data.stations || []).forEach(st => {
      if (!st.id) return;
      const li = document.createElement('li');
      li.textContent = st.name;
      li.onclick = () => selectStation(st.id, st.name);
      list.appendChild(li);
    });
  } catch (err) {
    setStatus('Fehler bei der Stationssuche: ' + err.message);
  }
}, 350));

document.addEventListener('click', (e) => {
  if (!e.target.closest('#search-box')) {
    document.getElementById('suggestions').innerHTML = '';
  }
});

function selectStation(stopId, name, refEpoch) {
  currentStopId = stopId;
  document.getElementById('stationTitle').textContent = name;
  document.getElementById('suggestions').innerHTML = '';
  document.getElementById('query').value = '';

  const url = new URL(location.href);
  url.searchParams.set('stopId', stopId);
  if (refEpoch) url.searchParams.set('time', refEpoch); else url.searchParams.delete('time');
  history.pushState({}, '', url);

  loadDepartures(refEpoch);
  window.scrollTo({top: 0, behavior: 'smooth'});
}

async function loadDepartures(refEpoch) {
  if (!currentStopId) return;
  setStatus('Lade Abfahrten…');

  try {
    let q = `${PROXY}?action=departures&stopId=${encodeURIComponent(currentStopId)}&n=12`;
    if (refEpoch) {
      q += `&time=${encodeURIComponent(new Date(refEpoch * 1000).toISOString())}`;
    }
    const res = await fetch(q);
    const data = await res.json();

    if (data.error) {
      renderError(data.error);
      setStatus('');
      return;
    }

    renderDepartures(data.departures || []);
    setStatus(refEpoch
      ? 'Abfahrten ab Ankunft der vorherigen Fahrt · ' + new Date().toLocaleTimeString('de-CH')
      : 'Aktualisiert ' + new Date().toLocaleTimeString('de-CH'));
  } catch (err) {
    renderError(err.message);
  }

  clearTimeout(refreshTimer);
  if (!refEpoch) refreshTimer = setTimeout(() => loadDepartures(), 30000);
}

function renderError(msg) {
  document.getElementById('departureTable').style.display = 'none';
  const status = document.getElementById('status');
  status.innerHTML = `<div class="error-hint">Fehler: ${escapeHtml(msg)}</div>`;
}

function renderDepartures(departures) {
  const tbody = document.getElementById('departureBody');
  tbody.innerHTML = '';
  document.getElementById('departureTable').style.display = departures.length ? 'table' : 'none';

  if (!departures.length) {
    document.getElementById('status').innerHTML = '<div class="empty-hint">Keine Abfahrten gefunden.</div>';
    return;
  }

  departures.forEach(dep => {
    const tr = document.createElement('tr');
    tr.className = 'dep-row';

    const timeStr = dep.live ? new Date(dep.live * 1000).toLocaleTimeString('de-CH', {hour:'2-digit', minute:'2-digit'}) : '–';

    let delayCell = '<span class="ontime">pünktlich</span>';
    if (dep.cancelled) {
      delayCell = '<span class="cancelled">ausgefallen</span>';
    } else if (dep.delayMin !== null && dep.delayMin > 0) {
      delayCell = `<span class="delay">+${dep.delayMin}′</span>`;
    }

    tr.innerHTML = `
      <td class="col-line"><span class="line">${escapeHtml(dep.line)}</span></td>
      <td class="col-nr tripnr">${dep.tripNumber ? escapeHtml(dep.tripNumber) : '–'}</td>
      <td class="col-dest">${escapeHtml(dep.destination)}</td>
      <td class="col-time">${timeStr}</td>
      <td class="col-delay">${delayCell}</td>
    `;
    tr.onclick = () => toggleChain(tr, dep);
    tbody.appendChild(tr);
  });
}

async function toggleChain(tr, dep) {
  const existing = tr.nextElementSibling;
  if (existing && existing.classList.contains('chain-row')) {
    existing.remove();
    return;
  }
  document.querySelectorAll('.chain-row').forEach(r => r.remove());

  if (!dep.tripId) {
    alert('Keine Fahrtnummer (tripId) vorhanden – Fahrtverlauf nicht möglich.');
    return;
  }

  const chainTr = document.createElement('tr');
  chainTr.className = 'chain-row';
  const td = document.createElement('td');
  td.colSpan = 5;
  td.innerHTML = '<div class="chain-wrap"><div class="chain-header">Lade Fahrtverlauf…</div></div>';
  chainTr.appendChild(td);
  tr.after(chainTr);

  try {
    const res = await fetch(`${PROXY}?action=trip&tripId=${encodeURIComponent(dep.tripId)}`);
    const data = await res.json();

    if (data.error) {
      td.innerHTML = `<div class="chain-wrap"><div class="chain-header">Fehler: ${escapeHtml(data.error)}</div></div>`;
      return;
    }

    td.innerHTML = `<div class="chain-wrap">${renderChain(data)}</div>`;
  } catch (err) {
    td.innerHTML = `<div class="chain-wrap"><div class="chain-header">Fehler beim Laden: ${escapeHtml(err.message)}</div></div>`;
  }
}

function renderChain(data) {
  const stopsHtml = (data.stops || []).map(stop => {
    const arr = fmtTime(stop.arrivalLive);
    const dep = fmtTime(stop.departureLive);
    const times = [arr !== '–' ? 'an ' + arr : null, dep !== '–' ? 'ab ' + dep : null].filter(Boolean).join(' · ');

    const delaySec = stop.departureDelaySec ?? stop.arrivalDelaySec;
    const delayHtml = stop.cancelled
      ? '<span class="cancelled">ausgefallen</span>'
      : (delaySec ? `<span class="delay">${fmtDelay(delaySec)}</span>` : '<span class="ontime">pünktlich</span>');

    const refEpoch = stop.arrivalLive || stop.arrivalSched;
    const isLink = !!stop.stopId;
    const nameAttrs = isLink
      ? `onclick="selectStation('${escapeAttr(stop.stopId)}','${escapeAttr(stop.name)}',${refEpoch || 'null'})"`
      : '';

    return `
      <div class="stop${stop.cancelled ? ' cancelled-stop' : ''}">
        <div class="stop-dot"></div>
        <div>
          <div class="stop-name${isLink ? '' : ' no-link'}" ${nameAttrs}>${escapeHtml(stop.name)}</div>
          <div class="stop-times">${escapeHtml(times || '–')}</div>
        </div>
        <div class="stop-right">
          ${delayHtml}
          ${stop.track ? `<div class="stop-track">Gl. ${escapeHtml(stop.track)}</div>` : ''}
        </div>
      </div>`;
  }).join('');

  return `
    <div class="chain-header">
      <b>${escapeHtml(data.line || '?')}</b>${data.tripNumber ? ' · Nr. ' + escapeHtml(data.tripNumber) : ''}
      ${data.destination ? ' → ' + escapeHtml(data.destination) : ''}
      <br>Tippe auf eine Station für die Abfahrtstafel ab dort.
    </div>
    <div class="timeline">${stopsHtml}</div>`;
}

function fmtTime(epoch) {
  if (!epoch) return '–';
  return new Date(epoch * 1000).toLocaleTimeString('de-CH', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}

function fmtDelay(sec) {
  const sign = sec < 0 ? '-' : '+';
  const abs = Math.abs(sec);
  const m = Math.floor(abs / 60);
  const s = abs % 60;
  return `${sign}${m}:${String(s).padStart(2,'0')}`;
}

function setStatus(msg) { document.getElementById('status').textContent = msg; }

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/[\\'"]/g, c => '\\' + c);
}
function debounce(fn, delay) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), delay); };
}
</script>

</body>
</html>
