<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>öV Dispatcher & Station Manager</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & React DOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased overflow-hidden">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // --- ICONS ---
    const IconTrain = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <rect x="4" y="3" width="16" height="16" rx="2" />
        <path d="M4 11h16" />
        <path d="M12 3v8" />
        <path d="M8 19l-3 3" />
        <path d="M16 19l3 3" />
        <circle cx="8" cy="15" r="1" />
        <circle cx="16" cy="15" r="1" />
      </svg>
    );

    const IconMapPin = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z" />
        <circle cx="12" cy="10" r="3" />
      </svg>
    );

    const IconPlus = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <line x1="12" y1="5" x2="12" y2="19" />
        <line x1="5" y1="12" x2="19" y2="12" />
      </svg>
    );

    const IconTrash = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="3 6 5 6 21 6" />
        <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2" />
      </svg>
    );

    const IconBuilding = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <rect x="4" y="2" width="16" height="20" rx="2" ry="2" />
        <path d="M9 22v-4h6v4" />
        <path d="M8 6h.01M16 6h.01M8 10h.01M16 10h.01M8 14h.01M16 14h.01" />
      </svg>
    );

    const IconCode = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="16 18 22 12 16 6" />
        <polyline points="8 6 2 12 8 18" />
      </svg>
    );

    const IconCopy = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
        <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" />
      </svg>
    );

    const IconCheck = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="20 6 9 17 4 12" />
      </svg>
    );

    const IconX = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    );

    // --- ANFANGSDATEN DER HALTESTELLEN ---
    const INITIAL_STATIONS = [
      { id: "custom_pinu_s_OFWF", name: "Otelfingen FEF" },
      { id: "custom_pinu_s_OFWFS", name: "Otelfingen FWF Süd" },
      { id: "custom_p_z", name: "Otelfingen Zentrum" },
      { id: "8503500", name: "Baden" },
      { id: "8503504", name: "Wettingen" },
      { id: "8503000", name: "Zürich HB" },
      { id: "8503509", name: "Regensdorf-Watt" }
    ];

    // --- ANFANGSDATEN DER TRIPS ---
    const INITIAL_TRIPS = [
      {
        tripId: "custom_pinu_t_1",
        line: "FEXT",
        tripNumber: "1",
        mode: "RAIL",
        agencyId: "sbb",
        agencyName: "Schweizerische Bundesbahnen SBB",
        agencyShort: "SBB",
        stops: [
          {
            stopId: "custom_pinu_s_OFWF",
            scheduled: "2026-08-30T12:00:00+02:00",
            departureLive: "2026-08-30T12:00:00+02:00",
            track: "F",
            legIndex: null,
            delayMin: 0
          },
          {
            stopId: "custom_pinu_s_OFWFS",
            scheduled: "2026-08-30T12:04:00+02:00",
            departureLive: "2026-08-30T12:04:00+02:00",
            track: "A",
            legIndex: 0,
            delayMin: 0
          },
          {
            stopId: "custom_p_z",
            scheduled: "2026-08-30T12:12:00+02:00",
            departureLive: "2026-08-30T12:12:00+02:00",
            track: "1",
            legIndex: 1,
            delayMin: 0
          }
        ]
      },
      {
        tripId: "custom_pinu_t_2",
        line: "S6",
        tripNumber: "18190",
        mode: "RAIL",
        agencyId: "sbb",
        agencyName: "Schweizerische Bundesbahnen SBB",
        agencyShort: "SBB",
        stops: [
          {
            stopId: "8503500",
            scheduled: "2026-08-30T14:15:00+02:00",
            departureLive: "2026-08-30T14:15:00+02:00",
            track: "4",
            legIndex: null,
            delayMin: 0
          },
          {
            stopId: "custom_pinu_s_OFWF",
            scheduled: "2026-08-30T14:26:00+02:00",
            departureLive: "2026-08-30T14:29:00+02:00",
            track: "2",
            legIndex: 0,
            delayMin: 3
          },
          {
            stopId: "8503000",
            scheduled: "2026-08-30T14:45:00+02:00",
            departureLive: "2026-08-30T14:48:00+02:00",
            track: "41",
            legIndex: 1,
            delayMin: 3
          }
        ]
      }
    ];

    function App() {
      const [stations, setStations] = useState(INITIAL_STATIONS);
      const [trips, setTrips] = useState(INITIAL_TRIPS);
      const [selectedStationId, setSelectedStationId] = useState("custom_pinu_s_OFWF");
      
      const [copied, setCopied] = useState(false);
      const [activeTab, setActiveTab] = useState('editor'); // 'editor', 'stations', 'json'
      
      // Modal zum Erstellen einer neuen Station
      const [showNewStationModal, setShowNewStationModal] = useState(false);
      const [newStationName, setNewStationName] = useState('');
      const [newStationId, setNewStationId] = useState('');

      // Formularzustand für Trip-Editor
      const [editingTripId, setEditingTripId] = useState(null);
      const [formLine, setFormLine] = useState('FEXT');
      const [formTripNumber, setFormTripNumber] = useState('2');
      const [formMode, setFormMode] = useState('RAIL');
      const [formAgencyShort, setFormAgencyShort] = useState('SBB');
      const [formAgencyName, setFormAgencyName] = useState('Schweizerische Bundesbahnen SBB');
      const [formStops, setFormStops] = useState([
        { stopId: 'custom_pinu_s_OFWF', time: '12:00', track: 'F', delayMin: 0 },
        { stopId: 'custom_p_z', time: '12:10', track: '1', delayMin: 0 }
      ]);

      // Hilfsfunktion: Station nach ID finden
      const getStationName = (id) => {
        const found = stations.find(s => s.id === id);
        return found ? found.name : id;
      };

      // Inline / Quick-Creation einer Station
      const handleRegisterStation = (nameInput, customId = null) => {
        if (!nameInput.trim()) return null;
        
        const existing = stations.find(s => s.name.toLowerCase() === nameInput.trim().toLowerCase());
        if (existing) return existing.id;

        const generatedId = customId && customId.trim() !== '' 
          ? customId.trim() 
          : `custom_s_${Date.now().toString().slice(-5)}`;

        const newEntry = { id: generatedId, name: nameInput.trim() };
        setStations(prev => [...prev, newEntry]);
        return generatedId;
      };

      const handleCreateStationFromModal = (e) => {
        e.preventDefault();
        if (!newStationName) return;
        handleRegisterStation(newStationName, newStationId);
        setNewStationName('');
        setNewStationId('');
        setShowNewStationModal(false);
      };

      // HALTESTELLE ZUM AKTUELLEN TRIP-FORMULAR HINZUFÜGEN
      const addStopToForm = () => {
        const defaultStationId = stations[0]?.id || '';
        setFormStops([...formStops, { stopId: defaultStationId, time: '12:15', track: '1', delayMin: 0 }]);
      };

      const updateFormStop = (index, field, value) => {
        const updated = [...formStops];
        updated[index][field] = value;
        setFormStops(updated);
      };

      const removeFormStop = (index) => {
        if (formStops.length <= 2) {
          alert('Ein Trip sollte mindestens 2 Haltestellen haben (Start -> Ziel).');
          return;
        }
        setFormStops(formStops.filter((_, i) => i !== index));
      };

      // SPEICHERN ODER ERSTELLEN EINES TRIPS
      const handleSaveTrip = (e) => {
        e.preventDefault();

        const tripId = editingTripId || `custom_pinu_t_${Date.now().toString().slice(-4)}`;
        const baseDate = "2026-08-30";

        const processedStops = formStops.map((st, idx) => {
          const timeString = st.time || "12:00";
          const scheduledIso = `${baseDate}T${timeString}:00+02:00`;
          
          let depLiveIso = scheduledIso;
          if (st.delayMin > 0) {
            const [h, m] = timeString.split(':').map(Number);
            const totalM = h * 60 + m + parseInt(st.delayMin, 10);
            const newH = Math.floor(totalM / 60) % 24;
            const newM = totalM % 60;
            depLiveIso = `${baseDate}T${newH.toString().padStart(2, '0')}:${newM.toString().padStart(2, '0')}:00+02:00`;
          }

          return {
            stopId: st.stopId,
            scheduled: scheduledIso,
            departureLive: depLiveIso,
            track: st.track || "",
            delayMin: parseInt(st.delayMin, 10) || 0,
            legIndex: idx === 0 ? null : idx - 1
          };
        });

        const newTripObj = {
          tripId,
          line: formLine,
          tripNumber: formTripNumber,
          mode: formMode,
          agencyId: formAgencyShort.toLowerCase(),
          agencyName: formAgencyName,
          agencyShort: formAgencyShort,
          stops: processedStops
        };

        if (editingTripId) {
          setTrips(trips.map(t => t.tripId === editingTripId ? newTripObj : t));
          setEditingTripId(null);
        } else {
          setTrips([...trips, newTripObj]);
        }
      };

      const handleEditTripClick = (trip) => {
        setEditingTripId(trip.tripId);
        setFormLine(trip.line);
        setFormTripNumber(trip.tripNumber);
        setFormMode(trip.mode);
        setFormAgencyShort(trip.agencyShort);
        setFormAgencyName(trip.agencyName);
        
        const convertedStops = trip.stops.map(st => {
          const time = st.scheduled ? st.scheduled.substring(11, 16) : '12:00';
          return {
            stopId: st.stopId,
            time: time,
            track: st.track || '',
            delayMin: st.delayMin || 0
          };
        });
        setFormStops(convertedStops);
      };

      const handleDeleteTrip = (tripId) => {
        setTrips(trips.filter(t => t.tripId !== tripId));
        if (editingTripId === tripId) {
          setEditingTripId(null);
        }
      };

      // DYNAMISCHES ERZEUGEN DES WUNSCH-JSON-FORMATS (STATIONEN UND DERIVED DEPARTURES)
      const generatedSchemaJSON = useMemo(() => {
        const outputStations = stations.map(st => {
          // Finde alle Abfahrten für diese Station aus allen Trips
          const departures = [];

          trips.forEach(trip => {
            const stopIndex = trip.stops.findIndex(s => s.stopId === st.id);
            
            // Wenn Halt existiert und nicht die Endstation ist
            if (stopIndex !== -1 && stopIndex < trip.stops.length - 1) {
              const currentStop = trip.stops[stopIndex];
              const destinationStop = trip.stops[trip.stops.length - 1];

              departures.push({
                tripId: trip.tripId,
                line: trip.line,
                tripNumber: trip.tripNumber,
                agency: trip.agencyShort,
                destination: getStationName(destinationStop.stopId),
                scheduled: currentStop.scheduled,
                track: currentStop.track,
                mode: trip.mode,
                trip: {
                  agency: {
                    id: trip.agencyId,
                    name: trip.agencyName
                  },
                  stops: trip.stops.map(s => ({
                    stopId: s.stopId,
                    name: getStationName(s.stopId),
                    departureLive: s.departureLive,
                    track: s.track,
                    legIndex: s.legIndex
                  }))
                }
              });
            }
          });

          return {
            id: st.id,
            name: st.name,
            departures: departures
          };
        });

        return { stations: outputStations };
      }, [stations, trips]);

      // Abfahrten für die aktuell gewählte Station auf der rechten Seite
      const currentStationDepartures = useMemo(() => {
        const stationObj = generatedSchemaJSON.stations.find(s => s.id === selectedStationId);
        return stationObj ? stationObj.departures : [];
      }, [generatedSchemaJSON, selectedStationId]);

      const copyToClipboard = () => {
        navigator.clipboard.writeText(JSON.stringify(generatedSchemaJSON, null, 2));
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      return (
        <div className="flex flex-col h-screen w-screen bg-slate-950 text-slate-100 overflow-hidden">
          
          {/* HEADER */}
          <header className="h-16 border-b border-slate-800 bg-slate-900/90 px-6 flex items-center justify-between flex-shrink-0 z-10 backdrop-blur">
            <div className="flex items-center gap-3">
              <div className="p-2 bg-blue-600/20 text-blue-400 rounded-lg border border-blue-500/30">
                <IconTrain className="w-5 h-5" />
              </div>
              <div>
                <h1 className="font-semibold text-base leading-none">öV Dispatcher & Station Manager</h1>
                <span className="text-xs text-slate-400">Live JSON Generator & Multi-Station Matrix</span>
              </div>
            </div>

            {/* HALTESTELLEN AKTIONEN & NAVIGATION */}
            <div className="flex items-center gap-3">
              <button 
                onClick={() => setShowNewStationModal(true)}
                className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-blue-400 font-medium text-xs rounded-lg flex items-center gap-1.5 border border-slate-700 transition"
              >
                <IconPlus className="w-3.5 h-3.5" /> Neue Station definieren
              </button>

              <div className="h-5 w-px bg-slate-800"></div>

              <div className="flex bg-slate-950 p-1 border border-slate-800 rounded-lg text-xs">
                <button 
                  onClick={() => setActiveTab('editor')}
                  className={`px-3 py-1 rounded-md transition ${activeTab === 'editor' ? 'bg-blue-600 text-white font-medium' : 'text-slate-400 hover:text-slate-200'}`}
                >
                  Trip Editor
                </button>
                <button 
                  onClick={() => setActiveTab('stations')}
                  className={`px-3 py-1 rounded-md transition ${activeTab === 'stations' ? 'bg-blue-600 text-white font-medium' : 'text-slate-400 hover:text-slate-200'}`}
                >
                  Stationen ({stations.length})
                </button>
                <button 
                  onClick={() => setActiveTab('json')}
                  className={`px-3 py-1 rounded-md transition flex items-center gap-1 ${activeTab === 'json' ? 'bg-blue-600 text-white font-medium' : 'text-slate-400 hover:text-slate-200'}`}
                >
                  <IconCode className="w-3.5 h-3.5" /> JSON Output
                </button>
              </div>
            </div>
          </header>

          {/* HAUPT-SPLIT-BEREICH */}
          <div className="flex-1 flex overflow-hidden">
            
            {/* LINKES PANEL: TRIPS & STATIONS EDITOR */}
            <div className="w-7/12 border-r border-slate-800 flex flex-col bg-slate-900/30 overflow-y-auto p-6 space-y-6">
              
              {/* TAB 1: TRIP FORMULAR & LISTE */}
              {activeTab === 'editor' && (
                <>
                  {/* FORMULAR ZUM ERSTELLEN/BEARBEITEN EINERS TRIPS */}
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4 shadow-xl">
                    <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                      <h2 className="text-sm font-bold text-slate-100 flex items-center gap-2">
                        <IconTrain className="w-4 h-4 text-blue-400" />
                        {editingTripId ? `Fahrt bearbeiten (${editingTripId})` : 'Neue Fahrt erstellen'}
                      </h2>
                      {editingTripId && (
                        <button 
                          onClick={() => setEditingTripId(null)}
                          className="text-xs text-slate-400 hover:text-slate-200 underline"
                        >
                          Abbrechen / Neu
                        </button>
                      )}
                    </div>

                    <form onSubmit={handleSaveTrip} className="space-y-4 text-xs">
                      <div className="grid grid-cols-4 gap-3">
                        <div>
                          <label className="block text-slate-400 mb-1 font-medium">Linie</label>
                          <input 
                            type="text" 
                            value={formLine} 
                            onChange={(e) => setFormLine(e.target.value)}
                            className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-slate-100 focus:outline-none focus:border-blue-500 font-semibold"
                            placeholder="z.B. FEXT, S6"
                            required
                          />
                        </div>
                        <div>
                          <label className="block text-slate-400 mb-1 font-medium">Fahrt- / Zug-Nr.</label>
                          <input 
                            type="text" 
                            value={formTripNumber} 
                            onChange={(e) => setFormTripNumber(e.target.value)}
                            className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-slate-100 focus:outline-none focus:border-blue-500"
                            placeholder="z.B. 1, 18190"
                          />
                        </div>
                        <div>
                          <label className="block text-slate-400 mb-1 font-medium">Transportunternehmen (Agency Kürzel)</label>
                          <input 
                            type="text" 
                            value={formAgencyShort} 
                            onChange={(e) => setFormAgencyShort(e.target.value)}
                            className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-slate-100 focus:outline-none focus:border-blue-500 font-semibold text-blue-400"
                            placeholder="z.B. SBB, PostAuto"
                            required
                          />
                        </div>
                        <div>
                          <label className="block text-slate-400 mb-1 font-medium">Modus</label>
                          <select 
                            value={formMode} 
                            onChange={(e) => setFormMode(e.target.value)}
                            className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-slate-100 focus:outline-none focus:border-blue-500"
                          >
                            <option value="RAIL">RAIL (Zug)</option>
                            <option value="BUS">BUS (Bus / Postauto)</option>
                            <option value="TRAM">TRAM</option>
                          </select>
                        </div>
                      </div>

                      <div>
                        <label className="block text-slate-400 mb-1 font-medium">EVU Name (Langbezeichnung)</label>
                        <input 
                          type="text" 
                          value={formAgencyName} 
                          onChange={(e) => setFormAgencyName(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-slate-100 focus:outline-none focus:border-blue-500"
                          placeholder="z.B. Schweizerische Bundesbahnen SBB"
                        />
                      </div>

                      {/* ZWISCHENHALTE UND DROPDOWN-STATIONEN */}
                      <div className="space-y-2 pt-3 border-t border-slate-800">
                        <div className="flex justify-between items-center mb-1">
                          <span className="font-semibold text-slate-200">Fahrweg / Haltestellen-Sequenz</span>
                          <button 
                            type="button" 
                            onClick={addStopToForm}
                            className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-blue-400 rounded text-xs flex items-center gap-1 transition"
                          >
                            <IconPlus className="w-3.5 h-3.5" /> Halt hinzufügen
                          </button>
                        </div>

                        <div className="space-y-2">
                          {formStops.map((st, idx) => (
                            <div key={idx} className="p-3 bg-slate-950 border border-slate-800 rounded-lg flex items-center gap-3">
                              <span className="font-mono text-slate-500 text-xs w-5 font-bold">{idx + 1}.</span>
                              
                              {/* DYNAMISCHES STATIONS DROPDOWN */}
                              <div className="flex-1">
                                <select 
                                  value={st.stopId}
                                  onChange={(e) => updateFormStop(idx, 'stopId', e.target.value)}
                                  className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-slate-100 focus:outline-none focus:border-blue-500"
                                >
                                  {stations.map(station => (
                                    <option key={station.id} value={station.id}>
                                      {station.name} ({station.id})
                                    </option>
                                  ))}
                                </select>
                              </div>

                              {/* ZEIT (HH:MM) */}
                              <div className="w-24">
                                <input 
                                  type="text" 
                                  value={st.time}
                                  onChange={(e) => updateFormStop(idx, 'time', e.target.value)}
                                  placeholder="12:00"
                                  className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-slate-100 font-mono text-center"
                                />
                              </div>

                              {/* GLEIS */}
                              <div className="w-16">
                                <input 
                                  type="text" 
                                  value={st.track}
                                  onChange={(e) => updateFormStop(idx, 'track', e.target.value)}
                                  placeholder="Gleis"
                                  className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-slate-100 text-center"
                                />
                              </div>

                              {/* VERSPÄTUNG IN MINUTEN */}
                              <div className="w-20">
                                <input 
                                  type="number" 
                                  value={st.delayMin}
                                  onChange={(e) => updateFormStop(idx, 'delayMin', e.target.value)}
                                  placeholder="+Min"
                                  className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-amber-400 font-mono text-center"
                                />
                              </div>

                              <button 
                                type="button" 
                                onClick={() => removeFormStop(idx)}
                                className="text-slate-500 hover:text-red-400 p-1 transition"
                                title="Halt entfernen"
                              >
                                <IconTrash className="w-4 h-4" />
                              </button>
                            </div>
                          ))}
                        </div>
                      </div>

                      <div className="flex justify-end pt-2">
                        <button 
                          type="submit" 
                          className="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-semibold shadow-lg shadow-blue-600/20 transition"
                        >
                          {editingTripId ? 'Fahrt-Änderungen speichern' : 'Fahrt im System registrieren'}
                        </button>
                      </div>
                    </form>
                  </div>

                  {/* VORHANDENE TRIPS LISTE */}
                  <div className="space-y-3">
                    <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400">
                      Aktuell angelegte Fahrten ({trips.length})
                    </h3>

                    <div className="grid gap-3">
                      {trips.map(t => (
                        <div key={t.tripId} className="p-4 bg-slate-900/60 border border-slate-800 rounded-xl flex items-center justify-between">
                          <div>
                            <div className="flex items-center gap-2">
                              <span className="font-bold text-sm text-blue-400">{t.line}</span>
                              <span className="text-xs text-slate-400 font-mono">#{t.tripNumber}</span>
                              <span className="px-2 py-0.5 rounded text-[10px] font-semibold bg-slate-800 text-slate-300 border border-slate-700">
                                {t.agencyShort}
                              </span>
                            </div>
                            <div className="text-xs text-slate-400 mt-1 flex items-center gap-2">
                              <span>Fahrweg:</span>
                              <strong className="text-slate-200">
                                {getStationName(t.stops[0]?.stopId)} &rarr; {getStationName(t.stops[t.stops.length - 1]?.stopId)}
                              </strong>
                              <span>({t.stops.length} Haltestellen)</span>
                            </div>
                          </div>

                          <div className="flex items-center gap-2">
                            <button 
                              onClick={() => handleEditTripClick(t)}
                              className="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-xs text-slate-200 rounded-md border border-slate-700"
                            >
                              Bearbeiten
                            </button>
                            <button 
                              onClick={() => handleDeleteTrip(t.tripId)}
                              className="p-1.5 text-slate-500 hover:text-red-400"
                            >
                              <IconTrash className="w-4 h-4" />
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </>
              )}

              {/* TAB 2: STATIONS VERZEICHNIS & SPEICHER */}
              {activeTab === 'stations' && (
                <div className="space-y-4">
                  <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                    <div>
                      <h2 className="text-sm font-bold text-slate-100">Stationen-Verzeichnis</h2>
                      <p className="text-xs text-slate-400">Alle hier gelisteten Stationen stehen in allen Dropdowns zur Auswahl.</p>
                    </div>
                    <button 
                      onClick={() => setShowNewStationModal(true)}
                      className="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white font-medium text-xs rounded-lg flex items-center gap-1.5 transition"
                    >
                      <IconPlus className="w-3.5 h-3.5" /> Station hinzufügen
                    </button>
                  </div>

                  <div className="grid gap-2">
                    {stations.map((st) => (
                      <div key={st.id} className="p-3 bg-slate-900 border border-slate-800 rounded-lg flex items-center justify-between text-xs">
                        <div className="flex items-center gap-3">
                          <IconMapPin className="w-4 h-4 text-blue-400" />
                          <div>
                            <div className="font-semibold text-slate-100">{st.name}</div>
                            <div className="font-mono text-[10px] text-slate-500">ID: {st.id}</div>
                          </div>
                        </div>

                        <button 
                          onClick={() => setStations(stations.filter(s => s.id !== st.id))}
                          className="text-slate-600 hover:text-red-400 p-1"
                          title="Station löschen"
                        >
                          <IconTrash className="w-3.5 h-3.5" />
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* TAB 3: LIVE JSON OUTPUT */}
              {activeTab === 'json' && (
                <div className="h-full flex flex-col space-y-3">
                  <div className="flex justify-between items-center">
                    <span className="text-xs text-slate-400 font-mono">Generiertes Stations-Schema</span>
                    <button 
                      onClick={copyToClipboard}
                      className="px-3 py-1 bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium rounded flex items-center gap-1.5 transition"
                    >
                      {copied ? <IconCheck className="w-3.5 h-3.5" /> : <IconCopy className="w-3.5 h-3.5" />}
                      {copied ? 'Kopiert!' : 'JSON Kopieren'}
                    </button>
                  </div>
                  <textarea 
                    value={JSON.stringify(generatedSchemaJSON, null, 2)}
                    readOnly
                    className="flex-1 w-full bg-slate-950 border border-slate-800 p-4 font-mono text-xs text-emerald-400 rounded-xl leading-relaxed focus:outline-none resize-none"
                  />
                </div>
              )}

            </div>

            {/* RECHTES PANEL: VORSCHAU DER GENERIERTEN ABFAHRTEN FÜR EINE GEWÄHLTE STATION */}
            <div className="w-5/12 flex flex-col bg-slate-950 p-6 overflow-y-auto space-y-6">
              
              {/* DROPDOWN SURROUNDING DYNAMISCH */}
              <div className="bg-slate-900/80 border border-slate-800 p-4 rounded-xl space-y-2">
                <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider">
                  Vorschau Abfahrtsmonitor
                </label>
                
                <div className="flex items-center gap-2">
                  <IconMapPin className="w-4 h-4 text-blue-400 flex-shrink-0" />
                  <select 
                    value={selectedStationId}
                    onChange={(e) => setSelectedStationId(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-slate-100 font-bold text-sm focus:outline-none focus:border-blue-500 cursor-pointer"
                  >
                    {stations.map(st => (
                      <option key={st.id} value={st.id}>{st.name} ({st.id})</option>
                    ))}
                  </select>
                </div>
              </div>

              {/* GENERIERTE ABFAHRTEN FÜR DIE SELEKTIERTE STATION */}
              <div className="space-y-3">
                <div className="flex justify-between items-center">
                  <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider">
                    Automatisch abgeleitete Abfahrten
                  </h3>
                  <span className="text-xs text-slate-500 font-mono">{currentStationDepartures.length} Einträge</span>
                </div>

                {currentStationDepartures.length === 0 ? (
                  <div className="p-8 text-center border border-dashed border-slate-800 rounded-xl text-slate-500 text-xs">
                    Keine Abfahrten an der Station <strong className="text-slate-300">{getStationName(selectedStationId)}</strong> vorhanden.
                  </div>
                ) : (
                  currentStationDepartures.map((dep, idx) => {
                    const scheduledTime = dep.scheduled ? dep.scheduled.substring(11, 16) : '--:--';
                    
                    return (
                      <div key={idx} className="p-4 bg-slate-900/60 border border-slate-800 rounded-xl space-y-3">
                        <div className="flex items-center justify-between">
                          <div className="flex items-center gap-3">
                            <div className="w-12 h-10 bg-blue-600/20 border border-blue-500/30 rounded-lg text-blue-400 font-bold flex flex-col items-center justify-center text-xs">
                              {dep.line}
                            </div>
                            <div>
                              <div className="font-bold text-slate-100 text-sm">{dep.destination}</div>
                              <div className="text-xs text-slate-400 flex items-center gap-2">
                                <span className="text-blue-400 font-semibold">{dep.agency}</span>
                                {dep.track && <span>• Gleis {dep.track}</span>}
                              </div>
                            </div>
                          </div>

                          <div className="text-right font-mono">
                            <div className="text-sm font-bold text-slate-100">{scheduledTime}</div>
                            <div className="text-[10px] text-emerald-400">pünktlich</div>
                          </div>
                        </div>

                        {/* TRIP STOPS INSPEKTOR */}
                        <div className="pt-2 border-t border-slate-800/80 text-[11px] text-slate-400 space-y-1">
                          <div className="font-semibold text-slate-300 text-[10px] uppercase">Zulauf-Sequenz (Stops):</div>
                          <div className="flex flex-wrap items-center gap-1.5 font-mono">
                            {dep.trip.stops.map((s, sIdx) => (
                              <React.Fragment key={sIdx}>
                                <span className={s.stopId === selectedStationId ? 'text-blue-400 font-bold underline' : 'text-slate-400'}>
                                  {s.name}
                                </span>
                                {sIdx < dep.trip.stops.length - 1 && <span className="text-slate-600">&rarr;</span>}
                              </React.Fragment>
                            ))}
                          </div>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>

            </div>

          </div>

          {/* MODAL: NEUE STATION ERSTELLEN */}
          {showNewStationModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 w-full max-w-md space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="text-sm font-bold text-slate-100 flex items-center gap-2">
                    <IconMapPin className="w-4 h-4 text-blue-400" /> Neue Station registrieren
                  </h3>
                  <button onClick={() => setShowNewStationModal(false)} className="text-slate-400 hover:text-slate-200">
                    <IconX className="w-4 h-4" />
                  </button>
                </div>

                <form onSubmit={handleCreateStationFromModal} className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1 font-medium">Station Name</label>
                    <input 
                      type="text" 
                      value={newStationName} 
                      onChange={(e) => setNewStationName(e.target.value)}
                      placeholder="z.B. Otelfingen, Golfpark"
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-blue-500 text-sm"
                      required
                    />
                  </div>

                  <div>
                    <label className="block text-slate-400 mb-1 font-medium">Custom Station-ID (Optional)</label>
                    <input 
                      type="text" 
                      value={newStationId} 
                      onChange={(e) => setNewStationId(e.target.value)}
                      placeholder="z.B. custom_pinu_s_OFGP (wird sonst automatisch erzeugt)"
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-slate-100 font-mono focus:outline-none focus:border-blue-500"
                    />
                  </div>

                  <div className="pt-2 flex justify-end gap-2">
                    <button 
                      type="button" 
                      onClick={() => setShowNewStationModal(false)}
                      className="px-3 py-1.5 bg-slate-800 text-slate-300 rounded-lg"
                    >
                      Abbrechen
                    </button>
                    <button 
                      type="submit" 
                      className="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-lg shadow-md"
                    >
                      Station speichern & vorbereiten
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
