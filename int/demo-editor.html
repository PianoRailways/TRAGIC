<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transit Data Editor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #0a0a0a;
            color: #eee;
            padding: 16px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
        
        .panel {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            overflow-y: auto;
            max-height: 90vh;
        }
        
        h1 {
            font-size: 1.5rem;
            margin-bottom: 24px;
            grid-column: 1 / -1;
            text-align: center;
        }
        
        h2 {
            font-size: 1.1rem;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid #333;
            color: #0aa;
        }
        
        h3 {
            font-size: 1rem;
            margin-bottom: 12px;
            color: #0aa;
        }
        
        h4, h5 {
            color: #888;
            margin-bottom: 8px;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        label {
            display: block;
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 4px;
            font-weight: 500;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 8px 12px;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 4px;
            color: #eee;
            font-size: 0.95rem;
            font-family: inherit;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #0aa;
            box-shadow: 0 0 4px rgba(0, 170, 170, 0.3);
        }
        
        .button-group {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        
        button {
            flex: 1;
            padding: 10px;
            background: #0aa;
            color: #000;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        button:hover {
            background: #099;
        }
        
        button:active {
            opacity: 0.8;
        }
        
        button.secondary {
            background: #333;
            color: #eee;
            flex: 1;
        }
        
        button.secondary:hover {
            background: #444;
        }
        
        button.danger {
            background: #c33;
            color: #fff;
            flex: 1;
        }
        
        button.danger:hover {
            background: #b22;
        }
        
        .station-item {
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 16px;
            margin-bottom: 16px;
        }
        
        .departure-item {
            background: #151515;
            border: 1px solid #222;
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 8px;
        }
        
        .stops-section {
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 12px;
            margin-top: 12px;
        }
        
        .stop-item {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 6px;
        }
        
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .row.full {
            grid-template-columns: 1fr;
        }
        
        .json-output {
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 12px;
            font-family: "Monaco", "Courier New", monospace;
            font-size: 0.85rem;
            max-height: 100%;
            overflow: auto;
            color: #8f8;
            white-space: pre-wrap;
            word-break: break-all;
        }
        
        .preview-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        
        .preview-title h2 {
            margin: 0;
            border: none;
            padding: 0;
        }
        
        .copy-btn {
            background: #0aa;
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        
        .copy-btn:hover {
            background: #099;
        }
        
        .status-msg {
            font-size: 0.85rem;
            padding: 8px;
            border-radius: 4px;
            margin-top: 8px;
            display: none;
        }
        
        .status-msg.show {
            display: block;
        }
        
        .status-msg.success {
            background: #0aa;
            color: #000;
        }
        
        .status-msg.error {
            background: #c33;
            color: #fff;
        }
        
        .small-button {
            padding: 6px 10px;
            font-size: 0.85rem;
            flex: 0;
            min-width: 100px;
        }
    </style>
</head>
<body>
    <h1>Transit Data Editor (Multi-Station)</h1>
    
    <div class="container">
        <!-- Editor Panel -->
        <div class="panel">
            <h2>Stationen</h2>
            
            <div id="stationsList"></div>
            
            <button onclick="addStation()">+ Station hinzufügen</button>
            <div id="statusMsg" class="status-msg"></div>
            
            <div class="button-group" style="margin-top: 20px;">
                <button class="secondary" onclick="downloadJSON()">⬇ Download JSON</button>
                <button class="danger" onclick="clearAll()">🗑 Zurücksetzen</button>
            </div>
        </div>
        
        <!-- Preview Panel -->
        <div class="panel">
            <div class="preview-title">
                <h2>JSON Preview</h2>
                <button class="copy-btn" onclick="copyToClipboard()">📋 Kopieren</button>
            </div>
            <div class="json-output" id="jsonOutput">{ }</div>
        </div>
    </div>
    
    <script>
        let stations = [];
        
        function initDemo() {
            stations = [
                {
                    id: 'demo-bahnhof',
                    name: 'Demo-Bahnhof',
                    departures: [
                        {
                            tripId: 'demo-s1-001',
                            line: 'S1',
                            tripNumber: '1001',
                            destination: 'Seestadt',
                            scheduled: '2099-06-21T08:15:00+02:00',
                            live: '2099-06-21T08:16:00+02:00',
                            delaySec: 60,
                            track: '3',
                            mode: 'RAIL',
                            trip: {
                                tripId: 'demo-s1-001',
                                line: 'S1',
                                tripNumber: '1001',
                                destination: 'Seestadt',
                                stops: [
                                    { stopId: 'demo-bahnhof', name: 'Demo-Bahnhof', departureSched: '2099-06-21T08:15:00+02:00', departureLive: '2099-06-21T08:16:00+02:00', track: '3', legIndex: 0 },
                                    { stopId: 'demo-mitte', name: 'Demo-Mitte', arrivalSched: '2099-06-21T08:22:00+02:00', departureSched: '2099-06-21T08:23:00+02:00', legIndex: 0 },
                                    { stopId: 'demo-seestadt', name: 'Seestadt', arrivalSched: '2099-06-21T08:35:00+02:00', legIndex: 0 }
                                ]
                            }
                        },
                        {
                            tripId: 'demo-bus-042',
                            line: '42',
                            destination: 'Bergdorf',
                            scheduled: '2099-06-21T08:28:00+02:00',
                            track: 'B',
                            mode: 'BUS'
                        }
                    ]
                },
                {
                    id: 'seehafen',
                    name: 'Seehafen',
                    departures: [
                        {
                            tripId: 'demo-ferry-007',
                            line: 'F7',
                            destination: 'Inselblick',
                            scheduled: '2099-06-21T08:40:00+02:00',
                            track: 'Steg 2',
                            mode: 'FERRY'
                        }
                    ]
                }
            ];
            renderStations();
            updatePreview();
        }
        
        function addStation() {
            stations.push({ id: '', name: '', departures: [] });
            renderStations();
        }
        
        function removeStation(stIdx) {
            stations.splice(stIdx, 1);
            renderStations();
            updatePreview();
        }
        
        function addDeparture(stIdx) {
            if (!stations[stIdx]) return;
            stations[stIdx].departures.push({
                tripId: '', line: '', tripNumber: '', destination: '', scheduled: '', live: '', 
                delaySec: null, track: '', mode: 'RAIL', trip: { tripId: '', line: '', tripNumber: '', destination: '', stops: [] }
            });
            renderStations();
        }
        
        function removeDeparture(stIdx, depIdx) {
            if (stations[stIdx]) {
                stations[stIdx].departures.splice(depIdx, 1);
                renderStations();
                updatePreview();
            }
        }
        
        function addStop(stIdx, depIdx) {
            if (stations[stIdx] && stations[stIdx].departures[depIdx]) {
                const dep = stations[stIdx].departures[depIdx];
                if (!dep.trip) dep.trip = { tripId: '', line: '', tripNumber: '', destination: '', stops: [] };
                dep.trip.stops.push({ stopId: '', name: '', arrivalSched: '', arrivalLive: '', departureSched: '', departureLive: '', track: '', legIndex: 0 });
                renderStations();
            }
        }
        
        function removeStop(stIdx, depIdx, stopIdx) {
            if (stations[stIdx] && stations[stIdx].departures[depIdx] && stations[stIdx].departures[depIdx].trip) {
                stations[stIdx].departures[depIdx].trip.stops.splice(stopIdx, 1);
                renderStations();
                updatePreview();
            }
        }
        
        function renderStations() {
            const list = document.getElementById('stationsList');
            list.innerHTML = '';
            
            stations.forEach((station, stIdx) => {
                const stationEl = document.createElement('div');
                stationEl.className = 'station-item';
                
                stationEl.innerHTML = `
                    <h3>Station ${stIdx + 1}</h3>
                    <div class="row">
                        <div class="form-group">
                            <label>Station ID</label>
                            <input type="text" value="${station.id || ''}" onchange="stations[${stIdx}].id = this.value; updatePreview()">
                        </div>
                        <div class="form-group">
                            <label>Station Name</label>
                            <input type="text" value="${station.name || ''}" onchange="stations[${stIdx}].name = this.value; updatePreview()">
                        </div>
                    </div>
                    <h4 style="margin-top: 16px;">Abfahrten</h4>
                    <div id="departures-${stIdx}"></div>
                    <button class="secondary small-button" onclick="addDeparture(${stIdx})" style="width: 100%; margin: 8px 0;">+ Abfahrt</button>
                    <button class="danger small-button" onclick="removeStation(${stIdx})" style="width: 100%; margin-top: 12px;">× Station</button>
                `;
                
                list.appendChild(stationEl);
                
                const depsContainer = document.getElementById(`departures-${stIdx}`);
                station.departures.forEach((dep, depIdx) => {
                    const depEl = document.createElement('div');
                    depEl.className = 'departure-item';
                    
                    depEl.innerHTML = `
                        <h5>Abfahrt ${depIdx + 1}</h5>
                        <div class="row">
                            <div class="form-group">
                                <label>Trip ID</label>
                                <input type="text" value="${dep.tripId || ''}" onchange="stations[${stIdx}].departures[${depIdx}].tripId = this.value; updatePreview()">
                            </div>
                            <div class="form-group">
                                <label>Linie</label>
                                <input type="text" value="${dep.line || ''}" onchange="stations[${stIdx}].departures[${depIdx}].line = this.value; updatePreview()">
                            </div>
                        </div>
                        <div class="row">
                            <div class="form-group">
                                <label>Fahrtnummer</label>
                                <input type="text" value="${dep.tripNumber || ''}" onchange="stations[${stIdx}].departures[${depIdx}].tripNumber = this.value; updatePreview()">
                            </div>
                            <div class="form-group">
                                <label>Ziel</label>
                                <input type="text" value="${dep.destination || ''}" onchange="stations[${stIdx}].departures[${depIdx}].destination = this.value; updatePreview()">
                            </div>
                        </div>
                        <div class="row">
                            <div class="form-group">
                                <label>Fahrplanzeit</label>
                                <input type="text" value="${dep.scheduled || ''}" placeholder="2099-06-21T08:15:00+02:00" onchange="stations[${stIdx}].departures[${depIdx}].scheduled = this.value; updatePreview()">
                            </div>
                            <div class="form-group">
                                <label>Aktuelle Zeit</label>
                                <input type="text" value="${dep.live || ''}" placeholder="2099-06-21T08:16:00+02:00" onchange="stations[${stIdx}].departures[${depIdx}].live = this.value; updatePreview()">
                            </div>
                        </div>
                        <div class="row">
                            <div class="form-group">
                                <label>Verspätung (Sek)</label>
                                <input type="number" value="${dep.delaySec || ''}" onchange="stations[${stIdx}].departures[${depIdx}].delaySec = this.value ? parseInt(this.value) : null; updatePreview()">
                            </div>
                            <div class="form-group">
                                <label>Gleis</label>
                                <input type="text" value="${dep.track || ''}" onchange="stations[${stIdx}].departures[${depIdx}].track = this.value; updatePreview()">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Verkehrsmittel</label>
                            <select onchange="stations[${stIdx}].departures[${depIdx}].mode = this.value; updatePreview()">
                                <option value="RAIL" ${dep.mode === 'RAIL' ? 'selected' : ''}>RAIL</option>
                                <option value="BUS" ${dep.mode === 'BUS' ? 'selected' : ''}>BUS</option>
                                <option value="TRAM" ${dep.mode === 'TRAM' ? 'selected' : ''}>TRAM</option>
                                <option value="SUBWAY" ${dep.mode === 'SUBWAY' ? 'selected' : ''}>SUBWAY</option>
                                <option value="FERRY" ${dep.mode === 'FERRY' ? 'selected' : ''}>FERRY</option>
                                <option value="HIGHSPEED" ${dep.mode === 'HIGHSPEED' ? 'selected' : ''}>HIGHSPEED</option>
                            </select>
                        </div>
                        <div class="stops-section">
                            <h5>Haltestellen</h5>
                            <div id="stops-${stIdx}-${depIdx}"></div>
                            <button class="secondary small-button" onclick="addStop(${stIdx}, ${depIdx})" style="width: 100%; margin-top: 6px;">+ Halt</button>
                        </div>
                        <button class="danger small-button" onclick="removeDeparture(${stIdx}, ${depIdx})" style="width: 100%; margin-top: 8px;">× Abfahrt</button>
                    `;
                    
                    depsContainer.appendChild(depEl);
                    
                    const stopsContainer = document.getElementById(`stops-${stIdx}-${depIdx}`);
                    const trip = dep.trip || { stops: [] };
                    if (trip.stops && trip.stops.length > 0) {
                        trip.stops.forEach((stop, stopIdx) => {
                            const stopEl = document.createElement('div');
                            stopEl.className = 'stop-item';
                            stopEl.innerHTML = `
                                <h5 style="margin: 0 0 6px;">Halt ${stopIdx + 1}</h5>
                                <div class="row">
                                    <div class="form-group" style="margin-bottom: 6px;">
                                        <label style="font-size: 0.8rem;">Stop ID</label>
                                        <input type="text" value="${stop.stopId || ''}" onchange="stations[${stIdx}].departures[${depIdx}].trip.stops[${stopIdx}].stopId = this.value; updatePreview()" style="padding: 6px 8px; font-size: 0.9rem;">
                                    </div>
                                    <div class="form-group" style="margin-bottom: 6px;">
                                        <label style="font-size: 0.8rem;">Name</label>
                                        <input type="text" value="${stop.name || ''}" onchange="stations[${stIdx}].departures[${depIdx}].trip.stops[${stopIdx}].name = this.value; updatePreview()" style="padding: 6px 8px; font-size: 0.9rem;">
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="form-group" style="margin-bottom: 6px;">
                                        <label style="font-size: 0.8rem;">Ankunft geplant</label>
                                        <input type="text" value="${stop.arrivalSched || ''}" onchange="stations[${stIdx}].departures[${depIdx}].trip.stops[${stopIdx}].arrivalSched = this.value; updatePreview()" style="padding: 6px 8px; font-size: 0.9rem;">
                                    </div>
                                    <div class="form-group" style="margin-bottom: 6px;">
                                        <label style="font-size: 0.8rem;">Ankunft aktuell</label>
                                        <input type="text" value="${stop.arrivalLive || ''}" onchange="stations[${stIdx}].departures[${depIdx}].trip.stops[${stopIdx}].arrivalLive = this.value; updatePreview()" style="padding: 6px 8px; font-size: 0.9rem;">
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="form-group" style="margin-bottom: 6px;">
                                        <label style="font-size: 0.8rem;">Abfahrt geplant</label>
                                        <input type="text" value="${stop.departureSched || ''}" onchange="stations[${stIdx}].departures[${depIdx}].trip.stops[${stopIdx}].departureSched = this.value; updatePreview()" style="padding: 6px 8px; font-size: 0.9rem;">
                                    </div>
                                    <div class="form-group" style="margin-bottom: 6px;">
                                        <label style="font-size: 0.8rem;">Abfahrt aktuell</label>
                                        <input type="text" value="${stop.departureLive || ''}" onchange="stations[${stIdx}].departures[${depIdx}].trip.stops[${stopIdx}].departureLive = this.value; updatePreview()" style="padding: 6px 8px; font-size: 0.9rem;">
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="form-group" style="margin-bottom: 6px;">
                                        <label style="font-size: 0.8rem;">Gleis</label>
                                        <input type="text" value="${stop.track || ''}" onchange="stations[${stIdx}].departures[${depIdx}].trip.stops[${stopIdx}].track = this.value; updatePreview()" style="padding: 6px 8px; font-size: 0.9rem;">
                                    </div>
                                    <div class="form-group" style="margin-bottom: 6px;">
                                        <label style="font-size: 0.8rem;">Leg Index</label>
                                        <input type="number" value="${stop.legIndex || 0}" onchange="stations[${stIdx}].departures[${depIdx}].trip.stops[${stopIdx}].legIndex = parseInt(this.value); updatePreview()" style="padding: 6px 8px; font-size: 0.9rem;">
                                    </div>
                                </div>
                                <button class="danger small-button" onclick="removeStop(${stIdx}, ${depIdx}, ${stopIdx})" style="width: 100%; padding: 4px; font-size: 0.85rem;">× Halt</button>
                            `;
                            stopsContainer.appendChild(stopEl);
                        });
                    }
                });
            });
        }
        
        function updatePreview() {
            const data = {
                stations: stations.map(station => {
                    const stationObj = {
                        id: station.id || undefined,
                        name: station.name || undefined,
                        departures: (station.departures || []).map(dep => {
                            const depObj = { tripId: dep.tripId || undefined, line: dep.line || undefined, tripNumber: dep.tripNumber || undefined, 
                                destination: dep.destination || undefined, scheduled: dep.scheduled || undefined, live: dep.live || undefined, 
                                delaySec: dep.delaySec || undefined, track: dep.track || undefined, mode: dep.mode || 'RAIL' };
                            
                            if (dep.trip && (dep.trip.stops?.length > 0 || dep.trip.tripId)) {
                                depObj.trip = { tripId: dep.trip.tripId || undefined, line: dep.trip.line || undefined, tripNumber: dep.trip.tripNumber || undefined, 
                                    destination: dep.trip.destination || undefined, stops: (dep.trip.stops || []).map(stop => {
                                        const stopObj = { stopId: stop.stopId || undefined, name: stop.name || undefined, arrivalSched: stop.arrivalSched || undefined, 
                                            arrivalLive: stop.arrivalLive || undefined, departureSched: stop.departureSched || undefined, 
                                            departureLive: stop.departureLive || undefined, track: stop.track || undefined, legIndex: stop.legIndex ?? undefined };
                                        Object.keys(stopObj).forEach(k => stopObj[k] === undefined && delete stopObj[k]);
                                        return stopObj;
                                    }) };
                                Object.keys(depObj.trip).forEach(k => depObj.trip[k] === undefined && delete depObj.trip[k]);
                            }
                            
                            Object.keys(depObj).forEach(k => depObj[k] === undefined && delete depObj[k]);
                            return depObj;
                        })
                    };
                    Object.keys(stationObj).forEach(k => stationObj[k] === undefined && delete stationObj[k]);
                    return stationObj;
                })
            };
            
            document.getElementById('jsonOutput').textContent = JSON.stringify(data, null, 2);
        }
        
        function copyToClipboard() {
            navigator.clipboard.writeText(document.getElementById('jsonOutput').textContent).then(() => {
                showStatus('Kopiert!', 'success');
            }).catch(() => showStatus('Fehler beim Kopieren', 'error'));
        }
        
        function downloadJSON() {
            const blob = new Blob([document.getElementById('jsonOutput').textContent], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `transit-data-${Date.now()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showStatus('Download gestartet', 'success');
        }
        
        function clearAll() {
            if (confirm('Wirklich alles löschen?')) {
                stations = [];
                renderStations();
                updatePreview();
            }
        }
        
        function showStatus(msg, type) {
            const el = document.getElementById('statusMsg');
            el.textContent = msg;
            el.className = `status-msg show ${type}`;
            setTimeout(() => el.classList.remove('show'), 2000);
        }
        
        function addStation() {
            stations.push({
                id: '',
                name: '',
                departures: []
            });
            renderStations();
        }
        
        function removeStation(idx) {
            stations.splice(idx, 1);
            renderStations();
            updatePreview();
        }
        
        function addDeparture(stIdx) {
            if (!stations[stIdx]) return;
            stations[stIdx].departures.push({
                tripId: '',
                line: '',
                tripNumber: '',
                destination: '',
                scheduled: '',
                live: '',
                delaySec: null,
                track: '',
                mode: 'RAIL',
                trip: { tripId: '', line: '', tripNumber: '', destination: '', stops: [] }
            });
            renderStations();
        }
        
        function removeDeparture(stIdx, depIdx) {
            if (stations[stIdx] && stations[stIdx].departures) {
                stations[stIdx].departures.splice(depIdx, 1);
                renderStations();
                updatePreview();
            }
        }
        
        function addStop(stIdx, depIdx) {
            if (stations[stIdx]?.departures[depIdx]?.trip) {
                stations[stIdx].departures[depIdx].trip.stops.push({
                    stopId: '',
                    name: '',
                    arrivalSched: '',
                    arrivalLive: '',
                    departureSched: '',
                    departureLive: '',
                    track: '',
                    legIndex: 0
                });
                renderStations();
            }
        }
        
        function removeStop(stIdx, depIdx, stopIdx) {
            if (stations[stIdx]?.departures[depIdx]?.trip?.stops) {
                stations[stIdx].departures[depIdx].trip.stops.splice(stopIdx, 1);
                renderStations();
                updatePreview();
            }
        }
        
        function initDemo() {
            stations = [
                {
                    id: 'demo-bahnhof',
                    name: 'Demo-Bahnhof',
