<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ÖV Verbindungssuche & Abfahrtstafel</title>
  <link rel="stylesheet" href="routing.css">
  <link rel="stylesheet" href="../line-container.css">
  <link rel="icon" type="image/png" href="tragic.png">
  <link rel="apple-touch-icon" href="tragic.png">
</head>
<body>
  <header id="app-header">
    <div id="header-left">
      <button id="btn-home" onClick="window.location = './?stopId=ch-opentransportdataswiss26_Parentch%3A1%3Asloid%3A82597'" title="Startseite">⌂ Home</button>
    </div>
    <div id="live-clock">--:--:--</div>
    <button id="btn-refresh">Reset</button>
  </header>

  <div class="main-wrapper">
    <section class="panel">
      <div class="panel-title">Verbindung suchen</div>
      <div class="form-grid">
        <div class="form-group">
          <label for="route-from-input">Von</label>
          <input type="text" id="route-from-input" placeholder="Start..." autocomplete="off">
          <div id="from-suggestions" class="suggestions"></div>
        </div>
        <div class="form-group">
          <label for="route-to-input">Nach</label>
          <input type="text" id="route-to-input" placeholder="Ziel..." autocomplete="off">
          <div id="to-suggestions" class="suggestions"></div>
        </div>
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label for="route-time">Abfahrt (optional)</label>
          <input type="datetime-local" id="route-time">
        </div>
        <div class="form-group" style="justify-content: flex-end;">
          <button id="btn-search-route" class="btn">Suchen</button>
        </div>
      </div>

      <div id="routing-hint"></div>
      <div id="routing-results" class="results-container">
        <table>
          <thead>
            <tr>
              <th class="col-time">Ab</th>
              <th class="col-time">An</th>
              <th class="col-dur">Dauer</th>
              <th class="col-bar">Verlauf</th>
              <th class="col-chg">Um</th>
            </tr>
          </thead>
          <tbody id="routing-tbody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <div class="panel-title">Abfahrtstafel</div>
      <div class="form-grid">
        <div class="form-group">
          <label for="board-station-input">Haltestelle</label>
          <input type="text" id="board-station-input" placeholder="Station suchen..." autocomplete="off">
          <div id="board-suggestions" class="suggestions"></div>
        </div>
        <div class="form-group" style="justify-content: flex-end;">
          <button id="btn-load-board" class="btn">Abfahrten laden</button>
        </div>
      </div>

      <div id="board-hint"></div>
      <div id="board-results" class="results-container">
        <table>
          <thead>
            <tr>
              <th class="col-time">Zeit</th>
              <th style="width:60px;">Linie</th>
              <th>Richtung</th>
              <th style="width:50px; text-align:right;">Gleis</th>
            </tr>
          </thead>
          <tbody id="board-tbody"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
